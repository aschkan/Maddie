# Self-hosted Overpass, from day one.
#
# This is the single biggest lesson from the previous build: the public mirrors
# (overpass-api.de, overpass.kumi.systems, overpass.osm.ch) return 429, 502,
# 504 and twenty-second timeouts continuously, and no amount of client-side
# backoff turns a dead mirror into map data.
#
# Maddie is NL-only, so it never needs planet data. The import below takes a
# few hours ONCE. After that: no rate limit, no 504s, much faster queries, and
# the app stops depending on the proxy pool for map data entirely.
#
#   docker compose up -d
#   docker compose logs -f overpass      # watch the import
#   OVERPASS_ENDPOINTS=http://127.0.0.1:12345/api/interpreter
#
services:
  overpass:
    image: wiktorn/overpass-api
    container_name: maddie-overpass
    environment:
      OVERPASS_MODE: init
      OVERPASS_PLANET_URL: https://download.geofabrik.de/europe/netherlands-latest.osm.bz2
      OVERPASS_DIFF_URL: https://download.geofabrik.de/europe/netherlands-updates/
      OVERPASS_RULES_LOAD: "10"
      OVERPASS_META: "no"
    volumes:
      - ./overpass-db:/db
    ports:
      - "12345:80"
    restart: unless-stopped
